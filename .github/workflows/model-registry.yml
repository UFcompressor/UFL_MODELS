name: Model registration

# CAESAR's register_model.py opens a "[model-registry] ..." pull request from the
# submitter's fork. pull_request_target runs this file and test/ from the base
# branch, never from the pull request: the request is fetched as git objects and
# read as data by test/check_registration.py, then merged if every check passes.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

# One run per pull request; a new push supersedes the old check. Do not queue
# all requests in one group: GitHub keeps one pending run per group and cancels
# the rest. Requests checked at the same time merge independently, and GitHub
# refuses a merge that conflicts, as any two registrations or retirements do
# (both append to the same catalog and README lines).
concurrency:
  group: model-registration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: startsWith(github.event.pull_request.title, '[model-registry] ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      result: ${{ steps.check.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
      - name: Fetch the request without checking it out
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/$PR/head"
      - name: Check the request
        id: check
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$AUTHOR_TYPE" != User ]]; then
            echo "Rejected: requests must be opened by a GitHub user" > result.txt
          else
            python3 test/check_registration.py --base HEAD --head "$HEAD_SHA" \
              --author "$AUTHOR" --author-id "$AUTHOR_ID" --repository "$REPOSITORY" \
              > result.txt 2>&1 || true
          fi
          cat result.txt
          delimiter="RESULT_$(openssl rand -hex 16)"
          { echo "result<<$delimiter"; cat result.txt; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
          grep -q '^Accepted: ' result.txt

  merge:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A merge commit (not squash) keeps the commit named in the checkpoint URL.
      # --match-head-commit refuses to merge anything pushed after the check.
      - name: Merge the checked commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          RESULT: ${{ needs.check.outputs.result }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR" --repo "$REPOSITORY" --merge --match-head-commit "$HEAD_SHA"; then
              printf 'Merged automatically.\n\n```\n%s\n```\n' "$RESULT" |
                gh pr comment "$PR" --repo "$REPOSITORY" --body-file -
              exit 0
            fi
            sleep 10  # GitHub may still be computing mergeability
          done
          exit 1

  report:
    needs: [check, merge]
    if: always() && (needs.check.result == 'failure' || needs.merge.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Explain why the request was not merged
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          RESULT: ${{ needs.check.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Not merged.\n\n```\n%s\n```\n\nLog: %s\n\nTo fix a request, rerun `register_model.py` with the same name: it updates this pull request and the checks run again. Otherwise close it.\n' \
            "${RESULT:-The merge failed after the checks passed; see the log.}" "$RUN_URL" |
            gh pr comment "$PR" --repo "$REPOSITORY" --body-file -
